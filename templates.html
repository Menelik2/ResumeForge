<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2563eb" />
  <title>Templates — Yeni Pro CV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/templates.css" />
</head>
<body>
  <div class="templates-page">
    <header class="site-header">
      <div class="container header-inner">
        <a href="index.html" class="logo">
          <span class="logo-icon" aria-hidden="true">
            <svg viewBox="0 0 32 32" width="36" height="36"><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#1e40af"/></linearGradient><rect width="32" height="32" rx="8" fill="url(#g)"/><path fill="#fff" d="M7.2 9.2h2.6l3.2 6.4 3.2-6.4h2.6l-4.6 8.6V23h-2.4v-5.2L7.2 9.2zm14.2 1.6c1.7 0 2.9.5 3.6 1.4.6.8.9 1.9.9 3.3s-.3 2.5-.9 3.3c-.7.9-1.9 1.4-3.6 1.4h-2.8V10.8h2.8zm-.2 7.6c.9 0 1.5-.2 1.9-.7.3-.5.5-1.2.5-2.2s-.2-1.7-.5-2.2c-.4-.5-1-.7-1.9-.7h-.7v5.8h.7z"/></svg>
          </span>
          Yeni Pro CV
        </a>
        <nav class="nav-links">
          <a href="index.html" class="btn btn-ghost btn-sm">Dashboard</a>
          <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          </button>
        </nav>
      </div>
    </header>

    <main class="container">
      <div class="templates-hero">
        <h1>Choose a Template</h1>
        <p>Select a professional design that matches your style. You can change templates anytime without losing your data.</p>
      </div>

      <div class="template-filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="professional">Professional</button>
        <button class="filter-btn" data-filter="creative">Creative</button>
        <button class="filter-btn" data-filter="minimal">Minimal</button>
        <button class="filter-btn" data-filter="ats">ATS</button>
        <button class="filter-btn" data-filter="student">Student</button>
        <button class="filter-btn" data-filter="developer">Developer</button>
      </div>

      <div id="template-grid" class="template-grid"></div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>Yeni Pro CV — All templates work offline and keep your data private.</p>
      </div>
    </footer>
  </div>

  <div class="toast-container"></div>

  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/templates.js"></script>
</body>
</html>
